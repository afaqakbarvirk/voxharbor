#!KAMAILIO
#
# VoxHarbor edge proxy
#  - registrar + digest auth (HA1 in MySQL)
#  - dispatcher load balancing / failover across FreeSWITCH nodes (set 1)
#  - rtpengine media relay on both call legs (incl. WebRTC <-> plain RTP)
#  - security: pike flood detection + htable ban list, scanner User-Agent filter
# Kamailio never touches audio itself.

####### Environment (.env via docker-compose) #######
#!defenvs DBURL=KAMAILIO_DBURL
#!defenvs REALM=SIP_REALM
#!defenv  EXTIP=EXTERNAL_IP

####### Topology #######
# FreeSWITCH nodes live in dispatcher set 1 (dispatcher.list); they are reached from
# the internal socket udp:172.28.0.10:5070 (set per destination via the socket attr).
#!define DS_SET "1"
#!define RTPENGINE_SOCK "udp:172.28.0.20:2223"
# nginx WebSocket proxy: every browser shares its source IP, so it is exempt from pike
#!define WS_PROXY "172.28.0.60"

#!define FLT_NATS 5
#!define FLT_DISPATCH 8
#!define FLT_SRC_WS 9
#!define FLB_NATB 6
#!define FLB_NATSIPPING 7

####### Global parameters #######
debug=2
log_stderror=yes
log_prefix="{$mt $hdr(CSeq) $ci} "
children=4
tcp_children=4
auto_aliases=no
server_header="Server: VoxHarbor"
user_agent_header="User-Agent: VoxHarbor"

# Phone side (advertised to the host IP the softphones dial)
listen=udp:172.28.0.10:5060 advertise EXTIP:5060
listen=tcp:172.28.0.10:5060 advertise EXTIP:5060
# Core side (FreeSWITCH nodes)
listen=udp:172.28.0.10:5070
# SIP over WebSocket for the browser console (reached only through the nginx proxy)
listen=tcp:172.28.0.10:8088

tcp_connection_lifetime=3605
tcp_accept_no_cl=yes

####### Modules #######
loadmodule "db_mysql.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "nathelper.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "dispatcher.so"
loadmodule "rtpengine.so"
loadmodule "htable.so"
loadmodule "pike.so"

modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")

modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "gruu_enabled", 0)

modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 2)
modparam("usrloc", "use_domain", 0)
modparam("usrloc", "nat_bflag", FLB_NATB)

# Passwords are never stored in clear text: auth uses the precomputed HA1 column
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "load_credentials", "")
modparam("auth_db", "use_domain", 0)

modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", FLB_NATSIPPING)
modparam("nathelper", "sipping_from", "sip:pinger@voxharbor")
modparam("nathelper|registrar", "received_avp", "$avp(RECEIVED)")

# Load balancing + health checks: OPTIONS ping every 10s; 2 failures -> inactive,
# 2 successes -> active again. Probing mode 1 = ping every node, always.
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "xavp_dst", "_dsdst_")
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_inactive_threshold", 2)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_from", "sip:dispatcher@voxharbor")

modparam("rtpengine", "rtpengine_sock", RTPENGINE_SOCK)

# Flood protection: more than 250 requests per 2s from one IP => banned for 5 min
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 250)
modparam("pike", "remove_latency", 4)
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")

####### Routing logic #######
request_route {
	route(SECURITY);
	route(REQSANITY);
	route(NATDETECT);

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			rtpengine_delete();
			route(RELAY);
		}
		exit;
	}
	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	route(WITHINDLG);

	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE")) record_route();

	# Loop prevention: calls coming back from FreeSWITCH go to the registered phone,
	# everything else is authenticated and sent to FreeSWITCH.
	if (ds_is_from_list(DS_SET)) {
		route(LOCATION);
		exit;
	}

	route(AUTH);

	if (is_method("REGISTER")) {
		route(REGISTRAR);
		exit;
	}

	if ($rU == $null) {
		sl_send_reply("484", "Address Incomplete");
		exit;
	}

	route(TOFS);
}

# Drop scanners and banned IPs silently (no reply = nothing for an attacker to learn)
route[SECURITY] {
	if ($sht(ipban=>$si) != $null) exit;

	if ($ua =~ "(friendly-scanner|sipvicious|sipcli|sip-scan|sipsak|vaxsipuseragent|pplsip)") {
		xlog("L_WARN", "SECURITY: dropped scanner '$ua' from $si:$sp\n");
		exit;
	}

	# Trusted internal peers are never rate limited
	if (ds_is_from_list(DS_SET) || $si == WS_PROXY) return;

	if (!pike_check_req()) {
		xlog("L_ALERT", "SECURITY: flood from $si ($rm), banned for 300s\n");
		$sht(ipban=>$si) = 1;
		exit;
	}
}

route[REQSANITY] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "Keepalive");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "malformed SIP from $si:$sp\n");
		exit;
	}
}

# 2 = Via received != source, 16 = rport mismatch, 64 = WebSocket client
route[NATDETECT] {
	force_rport();
	# Caller is a WebRTC endpoint: browser over WebSocket, or any DTLS-SRTP offer
	if ($proto == "ws" || $proto == "wss") setflag(FLT_SRC_WS);
	if (has_body("application/sdp") && search_body("UDP/TLS/RTP/SAVPF")) setflag(FLT_SRC_WS);
	if (!ds_is_from_list(DS_SET) && nat_uac_test("82")) {
		if (is_method("REGISTER")) {
			fix_nated_register();
		} else if (is_first_hop()) {
			set_contact_alias();
		}
		setflag(FLT_NATS);
	}
}

route[WITHINDLG] {
	if (!has_totag()) return;

	if (loose_route()) {
		if (!isdsturiset()) handle_ruri_alias();
		if (is_method("BYE")) {
			rtpengine_delete();
		} else if (is_method("ACK")) {
			route(NATMANAGE);
		} else if (is_method("NOTIFY")) {
			record_route();
		}
		route(RELAY);
		exit;
	}

	if (is_method("ACK")) {
		if (t_check_trans()) route(RELAY);
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

route[AUTH] {
	if (is_method("ACK|CANCEL|PRACK")) return;

	auth_check(REALM, "subscriber", "1");
	$var(rc) = $rc;
	if ($var(rc) == -2 || $var(rc) == -3) {
		# wrong password / unknown user
		xlog("L_NOTICE", "auth failed ($var(rc)) for $fU from $si:$sp\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	if ($var(rc) < 0) {
		auth_challenge(REALM, "1");
		exit;
	}
	if (!is_method("REGISTER|PUBLISH")) consume_credentials();
}

route[REGISTRAR] {
	if (isflagset(FLT_NATS)) {
		setbflag(FLB_NATB);
		if ($proto == "udp") setbflag(FLB_NATSIPPING);
	}
	if (!save("location")) sl_reply_error();
	exit;
}

route[LOCATION] {
	if (!lookup("location")) {
		$var(rc) = $rc;
		t_newtran();
		switch ($var(rc)) {
			case -1:
			case -3:
				send_reply("404", "Not Found");
				exit;
			case -2:
				send_reply("405", "Method Not Allowed");
				exit;
		}
	}
	route(RELAY);
}

# Round-robin (alg 4) across healthy FreeSWITCH nodes
route[TOFS] {
	if (!ds_select_dst(DS_SET, "4")) {
		xlog("L_ERR", "no FreeSWITCH node available for $rm $rU\n");
		send_reply("503", "Service Unavailable");
		exit;
	}
	xlog("L_INFO", "dispatch $rm $rU -> $du\n");
	setflag(FLT_DISPATCH);
	# A live node answers 100 Trying immediately: no provisional within 2s = dead node
	if (is_method("INVITE")) t_set_fr(120000, 2000);
	route(RELAY);
}

route[RELAY] {
	if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
		if (!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
	}
	if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
		if (!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
	}
	if (is_method("INVITE")) {
		if (!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
	}
	if (!t_relay()) sl_reply_error();
	exit;
}

# Every dialog is phone <-> FreeSWITCH (FS is a B2BUA), so the media direction follows
# from where a message comes from:
#   from a FreeSWITCH node  -> internal -> external (towards a phone)
#   from anything else      -> external -> internal (towards FreeSWITCH)
# Phone side: WebRTC (DTLS-SRTP, ICE, rtcp-mux) for browsers, plain RTP otherwise.
# FreeSWITCH side: always plain RTP/AVP.
route[RTPMANAGE] {
	if (!has_body("application/sdp")) return;

	$var(codecs) = "codec-strip=all codec-except=opus codec-except=PCMU codec-except=PCMA codec-except=telephone-event";
	$var(webrtc) = "UDP/TLS/RTP/SAVPF ICE=force DTLS=passive rtcp-mux-require generate-mid SDES-off";
	$var(plain) = "RTP/AVP ICE=remove DTLS=off SDES-off rtcp-mux-demux";

	if (ds_is_from_list(DS_SET)) {
		$var(dir) = "direction=internal direction=external";
		$var(prof) = $var(plain);
		if (is_request() && ($du =~ "transport=ws" || $ru =~ "transport=ws")) $var(prof) = $var(webrtc);
		if (is_reply() && isflagset(FLT_SRC_WS)) $var(prof) = $var(webrtc);
	} else {
		$var(dir) = "direction=external direction=internal";
		$var(prof) = $var(plain);
	}
	rtpengine_manage("replace-origin replace-session-connection $var(dir) $var(prof) $var(codecs)");
}

route[NATMANAGE] {
	if (is_request() && has_totag() && check_route_param("nat=yes")) setbflag(FLB_NATB);

	route(RTPMANAGE);

	if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) return;
	if (is_request() && !has_totag() && t_is_branch_route()) add_rr_param(";nat=yes");
	if (is_reply() && isbflagset(FLB_NATB) && is_first_hop()) set_contact_alias();
}

branch_route[MANAGE_BRANCH] {
	route(NATMANAGE);
}

onreply_route[MANAGE_REPLY] {
	if (status =~ "[12][0-9][0-9]") route(NATMANAGE);
}

failure_route[MANAGE_FAILURE] {
	if (t_is_canceled()) exit;

	# Instant retry: a FreeSWITCH node timed out or returned 5xx -> mark it down
	# (inactive + probing) and try the next node in the set.
	if (isflagset(FLT_DISPATCH) && (t_check_status("408|5[0-9][0-9]") || t_branch_timeout())) {
		xlog("L_WARN", "node $du failed ($T_reply_code) for $rU, marking down\n");
		ds_mark_dst("ip");
		if (ds_next_dst()) {
			xlog("L_INFO", "retrying $rU on $du\n");
			t_set_fr(120000, 2000);
			t_on_branch("MANAGE_BRANCH");
			t_on_failure("MANAGE_FAILURE");
			route(RELAY);
			exit;
		}
	}
	rtpengine_delete();
}

####### WebSocket handshake (browser console via nginx /ws) #######
event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();
	if ($Rp != 8088) {
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}
	if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
		if (ws_handle_handshake()) exit;
	}
	xhttp_reply("404", "Not Found", "", "");
}

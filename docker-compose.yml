name: voxharbor

# Signaling and media are separated:
#   kamailio  - SIP proxy, registrar, auth, load balancer, security   (5060 published)
#   rtpengine - media relay / NAT / WebRTC bridge                        (RTP 30000-30100 published)
#   fs1, fs2  - FreeSWITCH B2BUA nodes (dialplan, IVR, echo)            (internal only)
#   mysql     - subscribers (HA1) + location                            (internal only)
#   web       - browser test console + WebSocket proxy to Kamailio      (8080 published)
#   sipp      - load / failover test client                             (internal only)

networks:
  voxnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mysql-data:

x-freeswitch: &freeswitch
  build:
    context: ./freeswitch
  image: voxharbor/freeswitch:1.10.12-r3
  tty: true
  stdin_open: true
  restart: unless-stopped
  volumes:
    - ./freeswitch/conf/vars.xml:/etc/freeswitch/vars.xml:ro
    - ./freeswitch/conf/autoload_configs/acl.conf.xml:/etc/freeswitch/autoload_configs/acl.conf.xml:ro
    - ./freeswitch/conf/sip_profiles/internal.xml:/etc/freeswitch/sip_profiles/internal.xml:ro
    - ./freeswitch/conf/dialplan/default.xml:/etc/freeswitch/dialplan/default.xml:ro

services:
  mysql:
    image: mysql:8.4.7
    container_name: mysql
    command: ["--mysql-native-password=ON"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: kamailio
      MYSQL_USER: kamailio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      SIP_REALM: ${SIP_REALM:?set in .env}
      SIP_USER_PASSWORD: ${SIP_USER_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      voxnet:
        ipv4_address: 172.28.0.40

  rtpengine:
    build:
      context: ./rtpengine
    image: voxharbor/rtpengine:12.2.1.4
    container_name: rtpengine
    hostname: rtpengine
    restart: unless-stopped
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP:?set in .env}
    command:
      - sh
      - -c
      - >-
        exec rtpengine --config-file=/etc/rtpengine/rtpengine.conf
        --interface=internal/172.28.0.20
        --interface=external/172.28.0.20!$${EXTERNAL_IP}
    volumes:
      - ./rtpengine/rtpengine.conf:/etc/rtpengine/rtpengine.conf:ro
    networks:
      voxnet:
        ipv4_address: 172.28.0.20
    # RTP only. The ng control port (2223/udp) stays on voxnet.
    ports:
      - "30000-30100:30000-30100/udp"

  kamailio:
    build:
      context: ./kamailio
    image: voxharbor/kamailio:6.0.6-r0
    container_name: kamailio
    hostname: kamailio
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rtpengine:
        condition: service_started
    environment:
      KAMAILIO_DBURL: mysql://kamailio:${MYSQL_PASSWORD}@172.28.0.40/kamailio
      SIP_REALM: ${SIP_REALM}
      EXTERNAL_IP: ${EXTERNAL_IP}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
    networks:
      voxnet:
        ipv4_address: 172.28.0.10
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"

  fs1:
    <<: *freeswitch
    container_name: fs1
    hostname: fs1
    environment:
      NODE_NAME: fs1
    networks:
      voxnet:
        ipv4_address: 172.28.0.31

  fs2:
    <<: *freeswitch
    container_name: fs2
    hostname: fs2
    environment:
      NODE_NAME: fs2
    networks:
      voxnet:
        ipv4_address: 172.28.0.32

  web:
    image: nginx:1.27.5-alpine
    container_name: web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      voxnet:
        ipv4_address: 172.28.0.60
    ports:
      - "8080:80"

  sipp:
    build:
      context: ./sipp
    image: voxharbor/sipp:3.7.3
    container_name: sipp
    hostname: sipp
    init: true
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./sipp/scenarios:/sipp/scenarios
    networks:
      voxnet:
        ipv4_address: 172.28.0.50

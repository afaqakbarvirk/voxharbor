name: voxharbor

networks:
  voxnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mysql-data:

x-freeswitch: &freeswitch
  build:
    context: ./freeswitch
  image: voxharbor/freeswitch:1.10.12-r3
  tty: true
  stdin_open: true
  restart: unless-stopped
  volumes:
    - ./freeswitch/conf/vars.xml:/etc/freeswitch/vars.xml:ro
    - ./freeswitch/conf/autoload_configs/acl.conf.xml:/etc/freeswitch/autoload_configs/acl.conf.xml:ro
    - ./freeswitch/conf/sip_profiles/internal.xml:/etc/freeswitch/sip_profiles/internal.xml:ro
    - ./freeswitch/conf/dialplan/default.xml:/etc/freeswitch/dialplan/default.xml:ro

services:
  mysql:
    image: mysql:8.4.7
    container_name: mysql
    command: ["--mysql-native-password=ON"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: kamailio
      MYSQL_USER: kamailio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      SIP_REALM: ${SIP_REALM:?set in .env}
      SIP_USER_PASSWORD: ${SIP_USER_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      voxnet:
        ipv4_address: 172.28.0.40
    # no host ports: MySQL stays private to voxnet

  kamailio:
    build:
      context: ./kamailio
    image: voxharbor/kamailio:6.0.6-r0
    container_name: kamailio
    hostname: kamailio
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      KAMAILIO_DBURL: mysql://kamailio:${MYSQL_PASSWORD}@172.28.0.40/kamailio
      SIP_REALM: ${SIP_REALM}
      EXTERNAL_IP: ${EXTERNAL_IP:?set in .env}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    networks:
      voxnet:
        ipv4_address: 172.28.0.10
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"

  fs1:
    <<: *freeswitch
    container_name: fs1
    hostname: fs1
    environment:
      NODE_NAME: fs1
      EXTERNAL_IP: ${EXTERNAL_IP}
    networks:
      voxnet:
        ipv4_address: 172.28.0.31
    # SIP stays internal (Kamailio only). RTP range published until rtpengine takes over in Phase 4.
    ports:
      - "16384-16484:16384-16484/udp"

  web:
    image: nginx:1.27.5-alpine
    container_name: web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      voxnet:
        ipv4_address: 172.28.0.60
    ports:
      - "8080:80"

  sipp:
    build:
      context: ./sipp
    image: voxharbor/sipp:3.7.3
    container_name: sipp
    hostname: sipp
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./sipp/scenarios:/sipp/scenarios
    networks:
      voxnet:
        ipv4_address: 172.28.0.50

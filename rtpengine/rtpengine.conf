[rtpengine]
# Userspace forwarding only (no xt_RTPENGINE kernel module under WSL/Docker)
table = -1

# Logical interfaces are passed on the command line (docker-compose) because the
# external one advertises the host IP from .env:
#   internal/172.28.0.20                     -> FreeSWITCH side
#   external/172.28.0.20!<EXTERNAL_IP>       -> phone / browser side
# Kamailio picks the pair per call with direction=... flags.

# ng control protocol, only reachable on voxnet (never published to the host)
listen-ng = 172.28.0.20:2223
listen-cli = 127.0.0.1:9900

# RTP range published 1:1 to the host
port-min = 30000
port-max = 30100

# Free ports as soon as a call is deleted (load tests churn through calls)
delete-delay = 0
timeout = 60
silent-timeout = 3600
final-timeout = 10800

tos = 184
num-threads = 4
log-level = 6
log-stderr = true
foreground = true
